name: Build Arch release package

on:
  workflow_call:
    inputs:
      tag:
        description: 'Existing tag to package'
        required: true
        type: string
      publish_new_release:
        description: 'Create and publish a new release only after successful package verification'
        required: false
        type: boolean
        default: false
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to build (for example v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: read

jobs:
  arch-package:
    name: Arch Linux package
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name || github.ref_name }}
    steps:
      # The release PKGBUILD lives on main: its verified archive checksum is
      # committed after the source tag is finalized.
      - name: Checkout release packaging
        uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false

      - name: Validate tag and verified PKGBUILD
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::Expected a semantic release tag such as v1.0.0"
            exit 1
          }
          version="${RELEASE_TAG#v}"
          grep -Fxq "pkgver=$version" arch/PKGBUILD.aur.template || {
            echo "::error::AUR PKGBUILD version does not match the release tag"
            exit 1
          }
          if grep -q "REPLACE_WITH_VERIFIED_SHA256\|sha256sums=('SKIP')" arch/PKGBUILD.aur.template; then
            echo "::error::AUR PKGBUILD must contain a verified source checksum"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/e7-arch-package"
          cp arch/PKGBUILD.aur.template "$RUNNER_TEMP/e7-arch-package/PKGBUILD"

      - name: Build and test in official Arch Linux container
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --volume "$RUNNER_TEMP/e7-arch-package:/build" \
            --workdir /build \
            archlinux:base-devel \
            bash -euo pipefail -c '
              pacman -Syu --noconfirm --needed python python-numpy python-opencv tk
              useradd --create-home packager
              chown -R packager:packager /build
              # kdotool is an AUR runtime dependency, not needed by the
              # offline tests or package() step. Do not run AUR build scripts
              # or install services with elevated privileges in CI.
              runuser -u packager -- makepkg --nodeps --cleanbuild --check --noconfirm
              runuser -u packager -- makepkg --printsrcinfo > /build/.SRCINFO
              cd /build
              sha256sum ./*.pkg.tar.zst > package.sha256
            '

      - name: Upload unsigned Arch package and checksums
        uses: actions/upload-artifact@v7
        with:
          name: e7-shop-reroller-${{ env.RELEASE_TAG }}-archlinux
          path: |
            ${{ runner.temp }}/e7-arch-package/*.pkg.tar.zst
            ${{ runner.temp }}/e7-arch-package/package.sha256
            ${{ runner.temp }}/e7-arch-package/.SRCINFO
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30

  publish-release:
    name: Attach verified package to GitHub release
    needs: arch-package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name || github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PUBLISH_NEW_RELEASE: ${{ inputs.publish_new_release || false }}
    steps:
      - name: Download successful Arch build
        uses: actions/download-artifact@v7
        with:
          name: e7-shop-reroller-${{ env.RELEASE_TAG }}-archlinux
          path: dist

      - name: Verify checksum and published release
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          shopt -s nullglob
          packages=(./*.pkg.tar.zst)
          if (( ${#packages[@]} != 1 )); then
            echo "::error::Expected exactly one Arch package"
            exit 1
          fi
          sha256sum --check package.sha256
          if [[ "$PUBLISH_NEW_RELEASE" == "true" ]]; then
            if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "::error::Release $RELEASE_TAG already exists; refusing to overwrite it."
              exit 1
            fi
          else
            draft=$(gh release view "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')
            if [[ "$draft" != "false" ]]; then
              echo "::error::Release $RELEASE_TAG must be published before attaching assets"
              exit 1
            fi
          fi

      - name: Attach package and checksum without replacing existing assets
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          shopt -s nullglob
          packages=(./*.pkg.tar.zst)
          package_name="${packages[0]#./}"
          if [[ "$PUBLISH_NEW_RELEASE" == "true" ]]; then
            # Pull the release notes from the tagged changelog rather than
            # whatever newer text may now be on main.
            gh api "repos/$GITHUB_REPOSITORY/contents/CHANGELOG.md?ref=$RELEASE_TAG" \
              --jq '.content' | base64 --decode > CHANGELOG.md
            awk -v version="${RELEASE_TAG#v}" '
              index($0, "## " version " ") == 1 { printing=1; next }
              printing && /^## / { exit }
              printing { print }
            ' CHANGELOG.md > release-notes.md
            if [[ ! -s release-notes.md ]]; then
              echo "::error::No release notes found for $RELEASE_TAG in CHANGELOG.md"
              exit 1
            fi
            gh release create "$RELEASE_TAG" "${packages[0]}" package.sha256 \
              --repo "$GITHUB_REPOSITORY" \
              --title "E7 Shop Reroller $RELEASE_TAG" \
              --notes-file release-notes.md --draft
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false
            exit 0
          fi
          names=$(gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          have_package=false
          have_checksum=false
          if grep -Fxq "$package_name" <<< "$names"; then have_package=true; fi
          if grep -Fxq 'package.sha256' <<< "$names"; then have_checksum=true; fi
          if [[ "$have_package" == true && "$have_checksum" == true ]]; then
            echo "Assets already published; retaining the existing release files."
            exit 0
          fi
          if [[ "$have_package" == true || "$have_checksum" == true ]]; then
            echo "::error::Partial release assets exist; refusing to overwrite them"
            exit 1
          fi
          gh release upload "$RELEASE_TAG" "${packages[0]}" package.sha256 \
            --repo "$GITHUB_REPOSITORY"
