name: Offline regression tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-linux.txt
      - name: Install headless runtime for recognition tests
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk
          python -m pip install -r requirements-linux.txt
      - name: Verify image recognition and offline safety rules
        run: |
          python -c 'import cv2, tkinter; print("OpenCV:", cv2.__version__)'
          python -B -m unittest discover -s tests -v
